plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.armin.arcade'
    compileSdk 34

    defaultConfig {
        applicationId "com.armin.arcade"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // کلید ثابت: هر بیلد CI با یک امضای یکسان ساخته میشه تا اپدیت روی نسخه قبلی نصب بشه
    signingConfigs {
        debug {
            storeFile file('ci.p12')
            storePassword 'android'
            keyAlias 'ci'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
